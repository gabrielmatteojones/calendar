<div class="topbar">
  <div class="wrap">
    <span id="today"></span>
    <span class="sp"></span>
    <span id="sync" class="sync" data-ok="">Connessione…</span>
  </div>
</div>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/"><b>Jones Calendar</b><span class="mini">calendario<br>privato</span></a>
    <nav class="nav" id="nav" aria-label="Principale">
      {% for item in site.data.nav %}
        <a href="{{ item.url }}" class="{% if page.url == item.url %}active{% endif %}">{{ item.title }}</a>
      {% endfor %}
    </nav>
    <button class="btn go" data-new type="button">Nuovo evento</button>
    <button class="btn ghost" id="logout" type="button">Esci</button>
    <button class="burger" id="burger" type="button" aria-label="Apri il menu" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.4" fill="none"/></svg>
    </button>
  </div>
</header>
